name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test

      - run: bun run build

      # `bun publish` doesn't support npm's OIDC trusted publishing yet
      # (oven-sh/bun#22423, #24855) — trusted publishing needs npm's own CLI.
      - run: npm install -g npm@latest

      - run: npm publish
